<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <!-- 8-pointed star rosette, as in the Ministry / Dövlət Proqramı ornament -->
    <g id="star">
      <polygon points="30,0 21.21,8.79 21.21,21.21 8.79,21.21 0,30 -8.79,21.21 -21.21,21.21 -21.21,8.79 -30,0 -21.21,-8.79 -21.21,-21.21 -8.79,-21.21 0,-30 8.79,-21.21 21.21,-21.21 21.21,-8.79"/>
      <polygon points="16.5,0 11.67,4.83 11.67,11.67 4.83,11.67 0,16.5 -4.83,11.67 -11.67,11.67 -11.67,4.83 -16.5,0 -11.67,-4.83 -11.67,-11.67 -4.83,-11.67 0,-16.5 4.83,-11.67 11.67,-11.67 11.67,-4.83"/>
      <circle r="4"/>
    </g>
    <polygon id="ministar" points="10,0 7.07,2.93 7.07,7.07 2.93,7.07 0,10 -2.93,7.07 -7.07,7.07 -7.07,2.93 -10,0 -7.07,-2.93 -7.07,-7.07 -2.93,-7.07 0,-10 2.93,-7.07 7.07,-7.07 7.07,-2.93"/>
    <!-- buta, the Azerbaijani paisley -->
    <g id="buta">
      <path d="M-2,18 C-10,18 -14,10 -12,2 C-10,-6 -2,-12 8,-14 C4,-9 6,-4 8,1 C10,7 8,18 -2,18 Z"/>
      <path d="M8,-14 C12,-13 14,-9 11,-7 C9,-6 8,-8 9,-9"/>
      <path d="M-2,13 C-7,13 -9,8 -8,3 C-7,-2 -3,-6 2,-8"/>
      <circle cx="0" cy="7" r="1.6" fill="#9B8B53"/>
    </g>
    <g id="cap">
      <polygon points="-20,-4 0,-13 20,-4 0,5"/>
      <path d="M-11,0 v9 q11,6 22,0 v-9"/>
      <path d="M20,-4 v12"/>
      <circle cx="20" cy="10" r="1.8" fill="#9B8B53"/>
    </g>
    <g id="book">
      <path d="M0,-8 q-10,-6 -20,-3 v18 q10,-3 20,3 q10,-6 20,-3 v-18 q-10,-3 -20,3 z"/>
      <path d="M0,-8 v18"/>
      <path d="M-16,-4 q6,-2 12,1 M-16,1 q6,-2 12,1 M4,-3 q6,-3 12,-1 M4,2 q6,-3 12,-1"/>
    </g>
    <g id="globe">
      <circle r="13"/>
      <ellipse rx="5.5" ry="13"/>
      <path d="M-13,0 H13 M-11,-7 q11,4 22,0 M-11,7 q11,-4 22,0"/>
      <path d="M-18,-3 A18,18 0 0 0 3,18 M0,18 v5 M-7,23 h14"/>
    </g>
    <g id="owl">
      <ellipse cy="4" rx="13" ry="16"/>
      <circle cx="-5.5" cy="-2" r="5"/>
      <circle cx="5.5" cy="-2" r="5"/>
      <circle cx="-5.5" cy="-2" r="1.6" fill="#9B8B53"/>
      <circle cx="5.5" cy="-2" r="1.6" fill="#9B8B53"/>
      <polygon points="-2,3 2,3 0,7"/>
      <path d="M-10,-9 l-3,-7 l7,3 M10,-9 l3,-7 l-7,3"/>
      <path d="M-9,7 q2,7 6,9 M9,7 q-2,7 -6,9 M-4,20 v3 M4,20 v3"/>
    </g>
    <g id="plane">
      <path d="M-16,0 L16,-10 L6,12 L1,3 Z M1,3 L16,-10"/>
      <path d="M-22,8 q6,-2 10,1 M-26,14 q6,-2 10,1" stroke-dasharray="2 3"/>
    </g>
    <g id="diploma">
      <rect x="-16" y="-9" width="32" height="18" rx="3"/>
      <path d="M-10,-3 h14 M-10,2 h9"/>
      <circle cx="9" cy="3" r="4"/>
      <path d="M9,7 l-3,7 M9,7 l3,7"/>
    </g>
    <g id="pencil">
      <path d="M-13,-3 h18 l7,3 l-7,3 h-18 z M5,-3 v6 M-9,-3 v6"/>
    </g>
    <g id="leaf">
      <path d="M-11,11 Q0,1 11,-11"/>
      <path d="M-4,4 q-8,-1 -9,-9 q8,1 9,9 M3,-3 q1,-8 9,-9 q-1,8 -9,9"/>
    </g>
    <path id="sparkle" d="M0,-6 Q1,-1 6,0 Q1,1 0,6 Q-1,1 -6,0 Q-1,-1 0,-6Z" fill="#9B8B53" stroke="none"/>
  </defs>

  <rect width="280" height="280" fill="#F8F0DC"/>

  <g fill="none" stroke="#9B8B53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- stars on a grid: the 4 corners join into whole stars when the tile repeats -->
    <use href="#star" xlink:href="#star" x="0" y="0"/>
    <use href="#star" xlink:href="#star" x="280" y="0"/>
    <use href="#star" xlink:href="#star" x="0" y="280"/>
    <use href="#star" xlink:href="#star" x="280" y="280"/>
    <use href="#star" xlink:href="#star" x="140" y="140"/>

    <!-- edge motifs are drawn twice, so the halves meet across tiles -->
    <use href="#cap" xlink:href="#cap" x="140" y="2"/>
    <use href="#cap" xlink:href="#cap" x="140" y="282"/>
    <use href="#book" xlink:href="#book" x="0" y="140"/>
    <use href="#book" xlink:href="#book" x="280" y="140"/>

    <use href="#globe" xlink:href="#globe" transform="translate(70 62) rotate(-10)"/>
    <use href="#owl" xlink:href="#owl" transform="translate(212 66) rotate(6)"/>
    <use href="#plane" xlink:href="#plane" transform="translate(72 214) rotate(-6)"/>
    <use href="#diploma" xlink:href="#diploma" transform="translate(212 212) rotate(-16)"/>

    <use href="#buta" xlink:href="#buta" transform="translate(140 70) rotate(15)"/>
    <use href="#buta" xlink:href="#buta" transform="translate(140 210) rotate(195)"/>

    <use href="#pencil" xlink:href="#pencil" transform="translate(104 32) rotate(-35)"/>
    <use href="#pencil" xlink:href="#pencil" transform="translate(36 248) rotate(30)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(178 104) rotate(20)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(104 178) rotate(200)"/>
    <use href="#ministar" xlink:href="#ministar" x="246" y="36"/>
    <use href="#ministar" xlink:href="#ministar" x="36" y="104"/>
    <use href="#ministar" xlink:href="#ministar" x="246" y="178"/>

    <use href="#sparkle" xlink:href="#sparkle" x="64" y="140"/>
    <use href="#sparkle" xlink:href="#sparkle" x="216" y="140"/>
    <use href="#sparkle" xlink:href="#sparkle" x="178" y="246"/>
  </g>
  <g fill="#9B8B53">
    <circle cx="104" cy="104" r="1.5"/><circle cx="176" cy="176" r="1.5"/>
    <circle cx="176" cy="30" r="1.5"/><circle cx="30" cy="176" r="1.5"/>
    <circle cx="252" cy="110" r="1.5"/><circle cx="110" cy="252" r="1.5"/>
  </g>
</svg>
